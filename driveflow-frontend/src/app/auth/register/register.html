<!-- src/app/register/register.component.html -->
<div class="register-container">
  <div class="register-card">
    <div class="card-title">
      <h2>Registrarse</h2>
    </div>
    <div class="card-content">
      <!-- El formulario se enlaza con la función onSubmit() de tu componente -->
      <form (ngSubmit)="onSubmit()" class="register-form">

        <!-- Campo de Nombres -->
        <div class="form-field">
          <label for="nombres">Nombres*</label>
          <input id="nombres" type="text" [(ngModel)]="nombres" name="nombres" required>
        </div>

        <!-- Código de empresa (opcional) -->
        <div class="form-field">
          <label for="empresa_code">Código de empresa (opcional)</label>
          <input id="empresa_code" type="text" [(ngModel)]="empresa_code" name="empresa_code" placeholder="Ej: ABC123" (input)="onEmpresaCodeInput()" (blur)="validarCodigoEmpresa()">
          <small>Si tienes un código de empresa, ingrésalo para quedar asociado automáticamente.</small>
          <div *ngIf="validandoEmpresa" style="color:#555;margin-top:4px;">Validando código...</div>
          <div *ngIf="empresaValida === true && empresaNombre" style="color:#2e7d32;margin-top:4px;">Empresa: {{ empresaNombre }}</div>
          <div *ngIf="empresaValida === false" style="color:#c62828;margin-top:4px;">Código de empresa inválido</div>
        </div>

        <!-- Campo de Apellidos -->
        <div class="form-field">
          <label for="apellidos">Apellidos*</label>
          <input id="apellidos" type="text" [(ngModel)]="apellidos" name="apellidos" required>
        </div>

        <!-- Campo de Usuario -->
        <div class="form-field">
          <label for="username">Usuario*</label>
          <input id="username" type="text" [(ngModel)]="username" name="username" required>
        </div>

        <!-- Campo de Email -->
        <div class="form-field">
          <label for="email">Email*</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" required>
        </div>

        <!-- Campo de Contraseña -->
        <div class="form-field">
          <label for="password">Contraseña*</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" required>
          <!-- Rol fijo a 'cliente' -->
          <input type="hidden" name="tipo_usuario" [(ngModel)]="tipo_usuario" value="cliente">
        </div>

        <!-- Visualización del tipo de usuario (solo lectura) -->
        <div class="form-field">
          <label for="tipo_usuario_display">Tipo de usuario</label>
          <input id="tipo_usuario_display" type="text" value="Cliente" disabled aria-disabled="true"/>
        </div>

        <!-- Botón de Registro -->
        <button type="submit" class="register-button" [disabled]="validandoEmpresa || empresaValida === false">Registrar</button>
      </form>

      <!-- Muestra el mensaje del componente aquí, si existe -->
      <p *ngIf="message" class="message">{{ message }}</p>

      <div class="links">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar Sesión</a></p>
      </div>

    </div>
  </div>
</div>
