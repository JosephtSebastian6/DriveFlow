<div class="rp-container">
  <div class="rp-card">
    <h2>Establecer nueva contraseña</h2>
    <form (ngSubmit)="submit()" #f="ngForm">
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="8" placeholder="Mínimo 8 caracteres" />

      <label for="confirm">Confirmar contraseña</label>
      <input id="confirm" name="confirm" type="password" [(ngModel)]="confirm" required minlength="8" />

      <button type="submit" [disabled]="f.invalid || loading">{{ loading ? 'Guardando...' : 'Guardar' }}</button>
    </form>

    <p class="ok" *ngIf="message">{{ message }}</p>
    <p class="err" *ngIf="error">{{ error }}</p>

    <a routerLink="/login">Volver al inicio de sesión</a>
  </div>
</div>
