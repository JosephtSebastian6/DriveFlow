<div class="fp-container">
  <div class="fp-card">
    <h2>Recuperar contraseña</h2>
    <p>Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

    <form (ngSubmit)="submit()" #f="ngForm">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="tu@correo.com" />

      <button type="submit" [disabled]="f.invalid || loading">{{ loading ? 'Enviando...' : 'Enviar enlace' }}</button>
    </form>

    <p class="ok" *ngIf="message">{{ message }}</p>
    <p class="err" *ngIf="error">{{ error }}</p>

    <a routerLink="/login">Volver al inicio de sesión</a>
  </div>
</div>
